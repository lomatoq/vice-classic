# Provenance manifest for every block of code carried over from a pinned
# donor repository (spec v1.3 §2.1). Rules:
#   - no copy-paste without a [[unit]] entry here;
#   - no code from closed-source Vector Magic;
#   - papers give algorithms/formulas; implementations are clean-room;
#   - external OSS only after a license check;
#   - owner-controlled donors need explicit SPDX/license before public release.
#
# Unit schema:
#   [[unit]]
#   id = "coverage-rasterizer-v1"
#   source_repo = "lomatoq/v-ice"
#   source_sha = "<pinned sha>"
#   source_path = "src/core/raster.rs"
#   destination = "crates/vice-render/src/coverage.rs"
#   mode = "exact_port | ported_and_refactored | clean_room | reference_only"
#   authorization = "owner-controlled"
#   tests_ported = ["..."]
#   notes = "..."

schema = "vice-classic/porting-manifest/v1"

# M0 status: ZERO ported units. The M0 baseline runner (crates/vice-bench) is
# new code written for this repository. Pinned donor repositories are executed
# as external black-box baselines only; none of their code is linked, vendored
# or copied into this workspace in M0.

# M1 status: STILL ZERO ported units. vice-geom and vice-ir are written
# clean-room (donor sources were not opened while writing them); robust
# predicates come from the external OSS crate `robust` 1.2.0 (MIT OR
# Apache-2.0, verified — see THIRD_PARTY_NOTICES.md), consumed as a cargo
# dependency, not vendored. Per REVIEW_M0 condition 6, the first [[unit]]
# here requires a prior license/IP review of the donor.
#
# Porting CANDIDATES noted for a future licensed review (NOT ported now):
#   - lomatoq/v-ice  src/core/geom.rs   (Pt/Vec2 ops + geometry tests)
#   - lomatoq/v-ice  src/core/raster.rs (signed-area coverage, M2 candidate)
#   - lomatoq/v-ize  crates/vize-core/src/geom.rs (typed curve vocabulary)
# Until v-ice/Vice- carry an explicit license grant, these remain
# reference-only candidates and nothing from them may be copied.

# M2 status: STILL ZERO ported units. Spec §28 M2 names a "signed-area
# polygon coverage port", but REVIEW_M0 condition 6 stands: v-ice has no
# license grant, so vice-render (tessellation, coverage accumulator,
# partition renderer, ROI, seal skeleton) is CLEAN-ROOM: not a single line
# of donor code was carried over, and that independence is what has been
# verified — by two reviewers' n-gram scans against the pinned donors
# (REVIEW_M2_A §5: 0.21% of 12-grams and 0.07% of 16-grams against
# v-ice/src/raster.rs, remainder boilerplate) and by a design comparison
# showing opposite decisions in every load-bearing choice (prefix vs
# suffix fold, clamped vs raw signed winding, opposite off-canvas
# handling). The raster.rs candidate above remains reference-only.
#
# One verifiable qualification, recorded rather than glossed (REVIEW_M2_A
# M2-A-N6): three test NAMES and one canonical fixture coincide with the
# donor's (`half_pixel_offsets_are_exact`,
# `coverage_is_continuous_in_translation`, `circle_area_matches_pi_r_squared`,
# and the [0.5,2.5]^2 half-pixel rectangle). Those names are the natural
# English for the properties spec §2.1 itself lists as the tests to
# carry over, and the fixture is the canonical one for half-pixel
# coverage; no reviewer found copied code. The earlier absolute phrasing
# ("donor sources were not opened") is replaced by this checkable claim,
# because the value of this manifest is that every word in it can be
# verified. The differential-court rasterizers (tiny-skia,
# raqote) are external OSS cargo DEV-dependencies with verified licenses
# (THIRD_PARTY_NOTICES §2b), not vendored, not ported.

# M3 status: STILL ZERO ported units.
#
# M3 is the milestone where the temptation was strongest: §27.1 asks for a
# heterogeneous GT corpus, and the pinned donors carry ready-made fixtures
# and diagnostics. Nothing was taken. The corpus is:
#
#   - procedural scenes generated by `vice-bench::gt::grammar` / `recipes`;
#   - six SVG files hand-authored in this repository under
#     `tests/fixtures/gt/authored/`;
#   - adversarial fixtures and ambiguity pairs constructed in code.
#
# The planar-scene builder (`gt::build`) was written from the §6.1/§12
# contract rather than reused from the renderer's or the IR's test helpers,
# because §27.1 forbids the inverse crime: a corpus assembled by the code
# under test agrees with it for reasons unrelated to correctness.
#
# Dependency-status correction (REVIEW_M3 M3-N12): `tiny-skia` and `raqote`
# were dev-dependencies in M2; in M3 they are NORMAL dependencies of
# `crates/vice-bench` only, because the corpus generator is a binary rather
# than a test (§27.1 independent engines). They are still not vendored, not
# ported, and not linked by vice-geom / vice-ir / vice-render.
# See THIRD_PARTY_NOTICES §2c.
#
# The external tournament opponents of §27.3 (VTracer, Potrace) are run as
# separate PROCESSES and are likewise neither vendored nor linked; Potrace
# is GPL-2.0-or-later and out-of-process for exactly that reason.

# ---------------------------------------------------------------------------
# M3.5 status: STILL ZERO ported units.
#
# The factorial oracle harness (`crates/vice-bench/src/oracle/`) is written
# from spec §27.6 and §28 M3.5 directly. Nothing was taken from a donor: the
# donors have no factorial harness, no compatibility keys and no typed
# refusal vocabulary to take. The one thing that LOOKS like a port is the
# ceiling metric's edge-mean, and it is not one - it is the same scale-
# invariant statistic REVIEW_M2_A M2-A-N1 forced this repository to adopt for
# its own differential court, re-derived in `oracle::ceiling` over 8-bit
# premultiplied codes rather than over coverage.
#
# No new third-party dependency was added in M3.5; `Cargo.toml` and
# `Cargo.lock` are unchanged since 1e6ef13, so THIRD_PARTY_NOTICES needs no
# entry. The only crates the new module uses are already-declared ones
# (`serde`, `serde_json`, `sha2`, `hex`, `thiserror`) plus this workspace's
# own `vice-ir`, `vice-render` and `vice-geom`.
