[package]
name = "vice-render"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "vice-classic M2: certified partition renderer (exact polygon coverage on a fixed tessellation, premultiplied compositing, ROI, seal skeleton)"

[lints]
workspace = true

[dependencies]
vice-geom = { path = "../vice-geom" }
vice-ir = { path = "../vice-ir" }
hex = "0.4"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
proptest = "1"
raqote = { version = "0.8", default-features = false }
tiny-skia = "0.11"
