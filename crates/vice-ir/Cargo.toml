[package]
name = "vice-ir"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "vice-classic M1: canonical visible-scene IR, typed validation, canonical serialization and digests"

[lints]
workspace = true

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
vice-geom = { path = "../vice-geom" }

[dev-dependencies]
proptest = "1"
