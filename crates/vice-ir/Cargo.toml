[package]
name = "vice-ir"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "vice-classic M1: canonical visible-scene IR, typed validation, canonical serialization and digests"

[lints]
workspace = true

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
# float_roundtrip is REQUIRED for the seal skeleton: without it serde_json
# parses f64 with up to 2 ulp error and parse -> re-serialize is not
# byte-identical (caught by the roundtrip property test; ADR-0006).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
vice-geom = { path = "../vice-geom" }

[dev-dependencies]
proptest = "1"
