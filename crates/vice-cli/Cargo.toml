[package]
name = "vice-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "vice-classic selective Flat2 vectorization and production adapters (vicec)"

[lints]
workspace = true

[[bin]]
name = "vicec"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
vice-core = { path = "../vice-core" }
vice-evidence = { path = "../vice-evidence" }
vice-image = { path = "../vice-image" }
vice-ir = { path = "../vice-ir" }

[dev-dependencies]
tempfile = "3"
