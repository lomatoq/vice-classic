[package]
name = "vice-bench"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "vice-classic M0-M3: baseline runner, GT corpus, oracles, reports"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
# M3: the GT corpus, the supported-universe declaration and the scorecard
# all speak in the canonical IR and are gated by the certified renderer.
# M3 corpus rasterization by INDEPENDENT engines (spec §27.1). These are
# normal dependencies of the bench crate only; the core crates
# (vice-geom / vice-ir / vice-render) do not link them, and vice-bench is
# not a shipped artifact. Licenses re-verified against the actual packages
# in THIRD_PARTY_NOTICES §2c.
raqote = { version = "0.8.5", default-features = false }
tiny-skia = "0.11.4"
vice-geom = { path = "../vice-geom" }
vice-ir = { path = "../vice-ir" }
vice-render = { path = "../vice-render" }

[dev-dependencies]
tempfile = "3"
