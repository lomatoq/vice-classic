[package]
name = "vice-verify"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "vice-classic M7: combinatorial, geometric, quantization, isotopy, and serialized-delivery verification"

[lints]
workspace = true

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
vice-geom = { path = "../vice-geom" }
vice-ir = { path = "../vice-ir" }
vice-render = { path = "../vice-render" }
vice-svg = { path = "../vice-svg" }
