[package]
name = "vice-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "vice-classic browser-safe routed product adapter"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wasm-bindgen = "0.2"
vice-core = { path = "../vice-core" }
vice-ir = { path = "../vice-ir" }
