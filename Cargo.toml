[workspace]
resolver = "2"
members = [
    "crates/vice-bench",
    "crates/vice-cli",
    "crates/vice-core",
    "crates/vice-evidence",
    "crates/vice-fit",
    "crates/vice-geom",
    "crates/vice-image",
    "crates/vice-ir",
    "crates/vice-opt",
    "crates/vice-render",
    "crates/vice-svg",
    "crates/vice-topology",
    "crates/vice-verify",
]
# Baseline checkouts are cloned under runs/<out>/checkouts/ at run time; a
# donor crate without its own [workspace] must not be captured by this one.
exclude = ["runs", "baselines-work"]

# Milestone-scoped crate policy (spec v1.3 §4.1, §28): only crates with a real
# executable responsibility in the current milestone exist. No placeholders.
# M0: vice-bench (baseline runner). M1: vice-geom (conventions, robust
# predicates), vice-ir (canonical IR, validation, seal skeleton).
# M2: vice-render (certified partition renderer — its first real
# responsibility).
# M4: vice-image (canonical decode + premultiplied observation tensor) and
# vice-evidence (palette/exterior hypotheses, minimal global formation,
# premultiplied mixture, uncertainty, boundary observations) — both listed
# in §4.1 as active in M0–M4 and both created here, in the milestone that
# gives them their first responsibility. vice-cli likewise: the M4
# executable path (`vicec evidence`).
# M4.5: vice-topology — the crate §4 lists as "event trees, hypotheses, RAG,
# planar graph, signatures", created in the milestone that gives it its first
# executable responsibility (§11, §23, §28 M4.5): scalar fields, cubical
# max/min-tree critical events, saddle alternatives, topology signatures and
# the candidate envelope with its three pruning tiers. It carries no API for
# M5+: the DCEL half of §11.4 is a TYPED REFUSAL over data this crate
# computes, not an interface waiting to be filled.
# M6: vice-fit — the crate §4 lists as "line/arc/quad/cubic/primitive
# candidates + global DP/MDL", created in the milestone that gives it its
# first executable responsibility (§14–§15, §28 M6): hierarchical
# span-candidate schedules and budgets, cyclic k-best grammar search, joint
# constrained refit, a physical MDL code and materialized Stage-H
# relation/primitive siblings. It was created HERE and not earlier because
# §4.1 forbids empty crates for the future and §32 rule 7 forbids placeholder
# APIs.
# M7: vice-opt — the crate §4 lists as posterior, continuous/discrete
# optimization, and supported-search accounting. It is created in M7 together
# with those first executable responsibilities.
# M7: vice-svg and vice-verify — canonical PurePartition/SeamSafe
# materialization, independent parse/render, pre/post-quantization
# certification, and final delivery sealing. They are created together because
# the verifier's first real seal consumes the SVG crate's opaque parsed-render
# witness rather than trusting a report field.
# M7: vice-core — the first complete selective Flat2 executable pipeline. It
# owns the end-to-end outcome/report/artifact contract and is the only shipped
# caller allowed to compose evidence, DCEL, fitting, posterior, verification,
# and delivery.

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
