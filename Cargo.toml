[workspace]
resolver = "2"
members = ["crates/vice-bench"]
# Baseline checkouts are cloned under runs/<out>/checkouts/ at run time; a
# donor crate without its own [workspace] must not be captured by this one.
exclude = ["runs", "baselines-work"]

# M0 policy (spec v1.3 §4.1, §28 M0): only crates with a real executable
# responsibility in the current milestone exist. No placeholder crates.
# vice-geom / vice-ir / vice-image / vice-evidence / vice-render / vice-cli
# appear only in the milestone that gives them their first responsibility.

[workspace.package]
edition = "2021"
version = "0.0.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
