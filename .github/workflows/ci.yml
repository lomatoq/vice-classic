name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Tests (release)
        run: cargo test --release --workspace

  clean-checkout-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The frozen-gate rule below compares a commit against its parent.
          fetch-depth: 2
      - name: Install pinned toolchain
        run: rustup show
      - name: Regenerate the smoke corpus and compare bytes
        run: cargo run --release --bin gen-smoke -- --out tests/fixtures/smoke --check
      - name: Verify the smoke corpus against its manifest
        run: |
          cargo run --release --bin baseline-runner -- verify-corpus \
            --corpus tests/fixtures/smoke \
            --manifest tests/fixtures/smoke/SMOKE_MANIFEST.toml \
            --config configs/baselines.toml
      - name: Runner selftest
        run: |
          cargo run --release --bin baseline-runner -- selftest \
            --out runs/ci-selftest \
            --corpus tests/fixtures/smoke \
            --manifest tests/fixtures/smoke/SMOKE_MANIFEST.toml
      - name: Environment manifest (whole and normative projection)
        run: |
          cargo run --release --bin baseline-runner -- env
          cargo run --release --bin baseline-runner -- env --normative

  gt-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = full history: the frozen-gate rule below walks every commit
          # of the pushed range, and a depth of 2 made that impossible.
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup show
      # Spec §27.7 / §32 rule 9, enforced rather than requested: an EXISTING
      # gate file and production code may not change together.
      #
      # Checked over the WHOLE pushed range and PER COMMIT (REVIEW_M3 M3-N2).
      # The previous version diffed HEAD~1..HEAD, so a push carrying
      # twenty-two commits was inspected at its tip only and the interior was
      # never seen. Per commit rather than per range, because a range diff
      # would hide a gate change that a later commit reverted, and §27.7 is
      # about what one reviewed change contains.
      #
      # `--name-status` is required: creating a gate file alongside its
      # loader is a named exemption, and the status letter is what
      # distinguishes creation from modification.
      - name: Frozen-gate rule (§27.7) over the whole pushed range
        run: |
          set -u
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            COMMITS=$(git rev-list "${BEFORE}..${{ github.sha }}")
          else
            # First push of a branch, a force-push, or a fetch depth that
            # does not reach the base: check the tip rather than nothing, and
            # say so instead of reporting a silent pass.
            echo "NOTE: base commit unavailable; checking the tip commit only"
            COMMITS=$(git rev-list -1 HEAD)
          fi
          echo "commits to check:"
          echo "$COMMITS"
          # Gate paths that ALREADY EXISTED at the base of the push. The
          # exemption is about existence, and a commit's own parent is not
          # the right place to ask: deleting the gate file in one commit and
          # re-adding it with the code in the next is legal per commit and
          # moves the frozen value anyway (REVIEW_M3_5 M35-N6).
          EXISTING=""
          for G in configs/GATES_V1.toml; do
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}:${G}" 2>/dev/null; then
              EXISTING="$EXISTING --existing-gate $G"
            fi
          done
          echo "gate paths existing at the push base: ${EXISTING:-(none)}"
          FAIL=0
          for C in $COMMITS; do
            if git cat-file -e "${C}^^{commit}" 2>/dev/null; then
              DIFF=$(git diff --name-status "${C}^" "$C")
            else
              DIFF=$(git show --name-status --format= "$C")
            fi
            if ! printf '%s\n' "$DIFF" | cargo run --quiet --release --bin gt-corpus -- gates-check --stdin $EXISTING; then
              echo "offending commit: $C"
              FAIL=1
            fi
          done
          exit $FAIL

      # The sealed audit must be SEALED and untouched. A change after opening
      # is a typed burn violation and fails the build.
      - name: Sealed-audit burn policy (§27.1)
        run: |
          cargo run --release --bin gt-corpus -- audit-status \
            --seal docs/gt/AUDIT_SEAL.json \
            --manifest docs/gt/CORPUS_MANIFEST.json \
            --gates configs/GATES_V1.toml
      # The GT corpus regenerates from source on a clean checkout. CI runs
      # the `test` scope (one size, seconds); the FULL manifest is the
      # reviewer's documented command in docs/REPRODUCIBILITY_M3.md, because
      # regenerating every cell of the matrix is minutes of work and a check
      # nobody waits for is a check nobody runs.
      - name: GT corpus rebuilds deterministically (test scope)
        run: |
          cargo run --release --bin gt-corpus -- build \
            --out runs/ci-corpus/manifest-a.json --scope test
          cargo run --release --bin gt-corpus -- build \
            --out runs/ci-corpus/manifest-b.json --scope test
          diff runs/ci-corpus/manifest-a.json runs/ci-corpus/manifest-b.json
      # The COMMITTED artifact, verified (REVIEW_M3 M3-N7). Until now CI
      # built its own manifest and reported on that, so
      # docs/gt/CORPUS_MANIFEST.json was checked by nobody but a reviewer
      # running the command by hand.
      #
      # `--structural` because this runner is Linux and the manifest is
      # recorded on Windows. Corpus geometry comes from libm sin/cos/powf/exp,
      # so render digests are a TIER A artifact (§5.5, ADR-0008 §8) and are
      # NOT comparable across platforms - the first run of this very step is
      # what proved it, by failing while the same-platform determinism check
      # above passed. Structural mode compares composition, splits, cells,
      # identifiability and inverse-crime flags, and says in its output that
      # digests were not compared. Without the flag a cross-platform compare
      # is a typed refusal, never a silent pass.
      - name: The committed corpus manifest reproduces (structural, cross-platform)
        run: |
          cargo run --release --bin gt-corpus -- verify             --manifest docs/gt/CORPUS_MANIFEST.json --structural
      - name: M3 scorecard and gate table
        run: |
          cargo run --release --bin gt-corpus -- report \
            --manifest runs/ci-corpus/manifest-a.json \
            --gates configs/GATES_V1.toml \
            --seal docs/gt/AUDIT_SEAL.json \
            --out runs/ci-corpus/scorecard.json

      # §28 M3.5. The command exits non-zero when either gate clause fails,
      # so the two sentences are enforced by CI rather than read in a report.
      - name: M3.5 + M4 factorial oracle harness and gate table
        run: |
          cargo run --release --bin gt-corpus -- oracle \
            --out runs/ci-oracle/report.json --scope full
      # §28 M4. Three of the four gate clauses are computed from the
      # corridor report's own data, and the command exits non-zero when any
      # of them fails.
      - name: M4 corridor calibration and gate table
        run: |
          cargo run --release --bin gt-corpus -- corridor             --out runs/ci-corridor/report.json --scope full
      - name: The committed corridor report reproduces (structural, cross-platform)
        run: |
          cargo run --release --bin gt-corpus -- corridor-check             --report docs/gt/CORRIDOR_M4.json --structural
      # `--structural` for the same reason the corpus step uses it: the
      # oracle metrics are libm-derived floats and therefore Tier A (§5.5),
      # this runner is Linux and the artifact is recorded on Windows. Without
      # the flag a cross-platform compare is a typed refusal, never a silent
      # pass; with it, composition, arm identities, refusal reasons,
      # contamination status and the compatibility fingerprints are all
      # compared and the output says the metrics were not.
      - name: The committed oracle report reproduces (structural, cross-platform)
        run: |
          cargo run --release --bin gt-corpus -- oracle-check \
            --report docs/gt/ORACLE_M4.json --structural

  # REVIEW_M3 A7.2. Until now the DIGESTS of the committed artifacts were
  # verified by nobody: the ubuntu job above physically cannot, because
  # render digests and oracle metrics are TIER A (§5.5) and this corpus is
  # built out of libm trigonometry, so it runs the structural projection and
  # says so. The numbers therefore rested on a manual run on the recording
  # platform - the reviewer's and the author's.
  #
  # A windows runner records the same `(os, arch)` the artifacts do, so it
  # can run the FULL comparison: 1086 render digests and every oracle metric.
  # If this job ever fails while the ubuntu structural check passes, that is
  # not a flake - it is the same signature that found F-0020, and it would
  # mean `(os, arch)` is too coarse a name for the Tier A condition.
  #
  # Windows runners use pwsh, where a trailing backslash is not a line
  # continuation, so these commands are single lines on purpose.
  tier-a-digests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: The committed corpus manifest reproduces (Tier A, all 1086 digests)
        run: cargo run --release --bin gt-corpus -- verify --manifest docs/gt/CORPUS_MANIFEST.json
      - name: The committed oracle report reproduces (Tier A, every metric)
        run: cargo run --release --bin gt-corpus -- oracle-check --report docs/gt/ORACLE_M4.json
      - name: The committed corridor report reproduces (Tier A, every metric)
        run: cargo run --release --bin gt-corpus -- corridor-check --report docs/gt/CORRIDOR_M4.json

# Reproducing the pinned donor baselines needs local mirrors and a 104 MiB
# hash-pinned asset, which CI has neither of; that step is executed by the
# reviewer on a machine that has them (spec §34, docs/REPRODUCIBILITY_M3.md).
