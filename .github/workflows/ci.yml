name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Tests (release)
        run: cargo test --locked --release --workspace
      # The corpus-wide calibration measurements: they render and analyse
      # hundreds of images, so they are `#[ignore]`d out of the default path
      # (minutes in debug) and run HERE, in release, on every push. This is
      # the step that keeps the frozen M4 numbers measured rather than
      # remembered: the kernel width table, the clean-bucket noise scale, the
      # §1.6 thickness floor, the residual tolerance and the interior
      # weighting.
      - name: M4 calibration measurements (release, --ignored)
        run: cargo test --locked --release -p vice-bench --test frozen_calibration -- --ignored --nocapture

  clean-checkout-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The frozen-gate rule below compares a commit against its parent.
          fetch-depth: 2
      - name: Install pinned toolchain
        run: rustup show
      # F-2 again, in the second job that measures: a step that fails to
      # COMPILE must not be reachable from a step whose exit code is read as a
      # measurement.
      - name: Build the measurement binaries (this step does not measure)
        run: cargo build --locked --release --workspace --bins
      - name: Regenerate the smoke corpus and compare bytes
        run: cargo run --locked --release --bin gen-smoke -- --out tests/fixtures/smoke --check
      - name: Verify the smoke corpus against its manifest
        run: |
          cargo run --locked --release --bin baseline-runner -- verify-corpus \
            --corpus tests/fixtures/smoke \
            --manifest tests/fixtures/smoke/SMOKE_MANIFEST.toml \
            --config configs/baselines.toml
      - name: Runner selftest
        run: |
          cargo run --locked --release --bin baseline-runner -- selftest \
            --out runs/ci-selftest \
            --corpus tests/fixtures/smoke \
            --manifest tests/fixtures/smoke/SMOKE_MANIFEST.toml
      # §4.1: the milestone ends in a working CLI path, run on a committed
      # fixture rather than described.
      - name: M4 evidence CLI on a committed fixture
        run: |
          cargo run --locked --release --bin vicec -- evidence             tests/fixtures/smoke/circle_64.png --out runs/ci-evidence
      - name: Environment manifest (whole and normative projection)
        run: |
          cargo run --locked --release --bin baseline-runner -- env
          cargo run --locked --release --bin baseline-runner -- env --normative

  gt-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 0 = full history: the frozen-gate rule below walks every commit
          # of the pushed range, and a depth of 2 made that impossible.
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup show
      # F-2 (STATUS_M4_5 §17): build and measurement were ONE command, so a
      # step that failed to COMPILE was indistinguishable by exit code from a
      # step that measured and disagreed. The reviewer showed it with a clock:
      # one second against thirty-five.
      #
      # This step builds and nothing else. Every `cargo run` below is therefore
      # a measurement on an artifact that already exists, and a compile error
      # fails HERE, with the compiler's own message, before any number is
      # printed.
      - name: Build the measurement binaries (this step does not measure)
        run: cargo build --locked --release --workspace --bins
      # Spec §27.7 / §32 rule 9, enforced rather than requested: an EXISTING
      # gate file and production code may not change together.
      #
      # Checked over the WHOLE pushed range and PER COMMIT (REVIEW_M3 M3-N2).
      # The previous version diffed HEAD~1..HEAD, so a push carrying
      # twenty-two commits was inspected at its tip only and the interior was
      # never seen. Per commit rather than per range, because a range diff
      # would hide a gate change that a later commit reverted, and §27.7 is
      # about what one reviewed change contains.
      #
      # `--name-status` is required: creating a gate file alongside its
      # loader is a named exemption, and the status letter is what
      # distinguishes creation from modification.
      - name: Frozen-gate rule (§27.7) over the whole pushed range
        run: |
          set -u
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            COMMITS=$(git rev-list "${BEFORE}..${{ github.sha }}")
          else
            # M4-N9 (owner M5), closed here. This branch used to print
            #   NOTE: base commit unavailable; checking the tip commit only
            # and carry on. That is a gate degrading to advisory exactly where
            # the two-commit bypass of REVIEW_M3_5 M35-N6 lives: with no base,
            # `--existing-gate` is empty AND only the tip is inspected, so
            # deleting the gate file in one commit and re-adding it with the
            # code in the next passes.
            #
            # The base is now RECONSTRUCTED rather than given up on: everything
            # reachable from HEAD and not from the default branch is this
            # push's own range, which is what the rule needs. Only if that also
            # fails does the step REFUSE, because an instrument that cannot
            # check says so instead of passing (meta-rule M-4).
            git fetch --no-tags --quiet origin "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/default" 2>/dev/null || true
            if git rev-parse --verify --quiet refs/remotes/origin/default >/dev/null; then
              BASE_REF=$(git merge-base refs/remotes/origin/default HEAD)
              echo "base commit unavailable from the event; reconstructed from the default branch: $BASE_REF"
              COMMITS=$(git rev-list "${BASE_REF}..HEAD")
              [ -z "$COMMITS" ] && COMMITS=$(git rev-list -1 HEAD)
              BEFORE="$BASE_REF"
            else
              echo "REFUSED: the base of this push cannot be established, so the frozen-gate rule" >&2
              echo "         cannot be applied to the commits it is supposed to cover. Checking the" >&2
              echo "         tip alone would report a pass this instrument did not earn (M4-N9)." >&2
              exit 2
            fi
          fi
          echo "commits to check:"
          echo "$COMMITS"
          # Gate paths that ALREADY EXISTED at the base of the push. The
          # exemption is about existence, and a commit's own parent is not
          # the right place to ask: deleting the gate file in one commit and
          # re-adding it with the code in the next is legal per commit and
          # moves the frozen value anyway (REVIEW_M3_5 M35-N6).
          EXISTING=""
          for G in configs/GATES_V1.toml; do
            if [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}:${G}" 2>/dev/null; then
              EXISTING="$EXISTING --existing-gate $G"
            fi
          done
          echo "gate paths existing at the push base: ${EXISTING:-(none)}"
          FAIL=0
          for C in $COMMITS; do
            if git cat-file -e "${C}^^{commit}" 2>/dev/null; then
              DIFF=$(git diff --name-status "${C}^" "$C")
            else
              DIFF=$(git show --name-status --format= "$C")
            fi
            if ! printf '%s\n' "$DIFF" | cargo run --locked --quiet --release --bin gt-corpus -- gates-check --stdin $EXISTING; then
              echo "offending commit: $C"
              FAIL=1
            fi
          done
          exit $FAIL

      # The sealed audit must be SEALED and untouched. A change after opening
      # is a typed burn violation and fails the build.
      - name: Sealed-audit burn policy (§27.1)
        run: |
          cargo run --locked --release --bin gt-corpus -- audit-status \
            --seal docs/gt/AUDIT_SEAL.json \
            --manifest docs/gt/CORPUS_MANIFEST.json \
            --gates configs/GATES_V1.toml
      # The GT corpus regenerates from source on a clean checkout. CI runs
      # the `test` scope (one size, seconds); the FULL manifest is the
      # reviewer's documented command in docs/REPRODUCIBILITY_M3.md, because
      # regenerating every cell of the matrix is minutes of work and a check
      # nobody waits for is a check nobody runs.
      - name: GT corpus rebuilds deterministically (test scope)
        run: |
          cargo run --locked --release --bin gt-corpus -- build \
            --out runs/ci-corpus/manifest-a.json --scope test
          cargo run --locked --release --bin gt-corpus -- build \
            --out runs/ci-corpus/manifest-b.json --scope test
          diff runs/ci-corpus/manifest-a.json runs/ci-corpus/manifest-b.json
      # The COMMITTED artifact, verified (REVIEW_M3 M3-N7). Until now CI
      # built its own manifest and reported on that, so
      # docs/gt/CORPUS_MANIFEST.json was checked by nobody but a reviewer
      # running the command by hand.
      #
      # `--structural` because this runner is Linux and the manifest is
      # recorded on Windows. Corpus geometry comes from libm sin/cos/powf/exp,
      # so render digests are a TIER A artifact (§5.5, ADR-0008 §8) and are
      # NOT comparable across platforms - the first run of this very step is
      # what proved it, by failing while the same-platform determinism check
      # above passed. Structural mode compares composition, splits, cells,
      # identifiability and inverse-crime flags, and says in its output that
      # digests were not compared. Without the flag a cross-platform compare
      # is a typed refusal, never a silent pass.
      - name: The committed corpus manifest reproduces (structural, cross-platform)
        run: |
          cargo run --locked --release --bin gt-corpus -- verify             --manifest docs/gt/CORPUS_MANIFEST.json --structural
      - name: M3 scorecard and gate table
        run: |
          cargo run --locked --release --bin gt-corpus -- report \
            --manifest runs/ci-corpus/manifest-a.json \
            --gates configs/GATES_V1.toml \
            --seal docs/gt/AUDIT_SEAL.json \
            --out runs/ci-corpus/scorecard.json

      # §28 M3.5. The command exits non-zero when either gate clause fails,
      # so the two sentences are enforced by CI rather than read in a report.
      - name: M3.5 + M4 factorial oracle harness and gate table
        run: |
          cargo run --locked --release --bin gt-corpus -- oracle \
            --out runs/ci-oracle/report.json --scope full
      # §28 M4. Three of the four gate clauses are computed from the
      # corridor report's own data, and the command exits non-zero when any
      # of them fails.
      - name: M4 corridor calibration and gate table
        run: |
          cargo run --locked --release --bin gt-corpus -- corridor             --out runs/ci-corridor/report.json --scope full
      - name: The committed corridor report reproduces (structural, cross-platform)
        run: |
          cargo run --locked --release --bin gt-corpus -- corridor-check             --report docs/gt/CORRIDOR_M4.json --structural
      # `--structural` for the same reason the corpus step uses it: the
      # oracle metrics are libm-derived floats and therefore Tier A (§5.5),
      # this runner is Linux and the artifact is recorded on Windows. Without
      # the flag a cross-platform compare is a typed refusal, never a silent
      # pass; with it, composition, arm identities, outcomes, refusal reasons
      # and contamination status are compared and the output says the metrics
      # were not.
      #
      # NOT compared: the compatibility fingerprints. They are hashes over
      # scene digests, hence functions of libm, and dropping them IS the
      # F-0022 fix. This comment said the opposite until M4 (condition B3 /
      # REVIEW_M3_5 M35-N1).
      - name: The committed oracle report reproduces (structural, cross-platform)
        run: |
          cargo run --locked --release --bin gt-corpus -- oracle-check \
            --report docs/gt/ORACLE_M4.json --structural
      # §28 M4.5. All THREE gate clauses are computed from the recall
      # report's own data and the command exits non-zero when any of them
      # fails, so "the GT-equivalent topology is in the envelope",
      # "ambiguous fixtures retain alternatives" and "no
      # magic-threshold-only architecture" are things CI runs rather than
      # things a status document says.
      - name: M4.5 topology candidate recall and gate table
        run: |
          cargo run --locked --release --bin gt-corpus -- topology \
            --out runs/ci-topology/report.json --scope full
      # `--structural` for the same reason the three steps above use it: the
      # metrics are libm-derived floats and this runner is Linux while the
      # artifact is recorded on Windows. The M4.5 projection is deliberately
      # LESS lossy than the other two - it keeps every component and hole
      # count and every recall boolean, because those are integers a
      # different libm cannot move without moving the topology itself.
      - name: The committed topology report reproduces (structural, cross-platform)
        run: |
          cargo run --locked --release --bin gt-corpus -- topology-check \
            --report docs/gt/TOPOLOGY_M4_5.json --structural
      # §28 M5. All FOUR gate clauses are computed from the run's own data and
      # the command exits non-zero when any of them fails.
      #
      # These four steps did not exist until delta-1, and their absence is the
      # whole of REDTEAM_M5 RT5-A3 / REVIEW_M5_A N3 / REVIEW_M5_B N3: C244's
      # commit message described five M5 steps, `ci.yml` received one
      # (`dcel-check`, in the windows job), and six places in the tree went on
      # saying "runs in CI". `dcel-check` compares the artifact and never calls
      # `gate_table`, so a run with four NOT MET clauses would have passed it —
      # which is exactly what RT5-A1 was. F-7 is "a mechanism-existence check
      # sees a PHRASE, not a behaviour", and it was committed by the commit
      # that reported it closed.
      - name: M5 shared DCEL and topological transactions, and gate table
        run: |
          cargo run --locked --release --bin gt-corpus -- dcel \
            --out runs/ci-dcel/report.json --scope full
      - name: The committed DCEL report reproduces (structural, cross-platform)
        run: |
          cargo run --locked --release --bin gt-corpus -- dcel-check \
            --report docs/gt/DCEL_M5.json --structural
      # The knockouts. Each applies the defect its clause forbids and requires
      # the measurement to move; each has a positive control in the same test.
      # `every_gate_clause_has_a_knockout_that_reddens_it` compares the number
      # of knockouts against the number of rows `gate_table()` returns, so a
      # fifth clause added without a knockout fails here rather than passing.
      - name: M5 clause knockouts (release, --ignored)
        run: cargo test --locked --release -p vice-bench --test dcel_harness -- --ignored --nocapture
      # The DCEL's proof domain, on all three axes: every labelling of a 4x4
      # under both convention arms, and the structural register at 256 and 512
      # px. Without this step two of the three axes ADR-0031 names run nowhere
      # automatic, and a defect that only fires above the corpus ceiling is
      # caught only by a test connected to nothing (REVIEW_M5_B attack A3).
      - name: M5 DCEL proof domain (release, --ignored)
        run: cargo test --locked --release -p vice-topology --test dcel_props -- --ignored --nocapture
      # §28 M6. The first step exercises candidate generation, k-best, the
      # joint solve and Stage H over every development chain in one cell per
      # scene. The second measures all five geometry interventions over the
      # raster-derived common population (including the explicit family/joint
      # witnesses) and exits non-zero if any gate row is not met.
      - name: M6 Stage G/H corpus population (release, --ignored)
        run: cargo test --locked --release -p vice-bench fit::tests::the_candidate_stage_over_the_corpus -- --ignored --nocapture
      - name: M6 five-arm geometry decomposition and gate table
        run: |
          cargo run --locked --release --bin gt-corpus -- geometry-m6 \
            --gates configs/GATES_V1.toml \
            --out runs/ci-geometry-m6/report.json

  # REVIEW_M3 A7.2. Until now the DIGESTS of the committed artifacts were
  # verified by nobody: the ubuntu job above physically cannot, because
  # render digests and oracle metrics are TIER A (§5.5) and this corpus is
  # built out of libm trigonometry, so it runs the structural projection and
  # says so. The numbers therefore rested on a manual run on the recording
  # platform - the reviewer's and the author's.
  #
  # A windows runner records the same `(os, arch)` the artifacts do, so it
  # can run the FULL comparison: 1086 render digests and every oracle metric.
  # If this job ever fails while the ubuntu structural check passes, that is
  # not a flake - it is the same signature that found F-0020, and it would
  # mean `(os, arch)` is too coarse a name for the Tier A condition.
  #
  # Windows runners use pwsh, where a trailing backslash is not a line
  # continuation, so these commands are single lines on purpose.
  tier-a-digests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: The committed corpus manifest reproduces (Tier A, all 1086 digests)
        run: cargo run --locked --release --bin gt-corpus -- verify --manifest docs/gt/CORPUS_MANIFEST.json
      - name: The committed oracle report reproduces (Tier A, every metric)
        run: cargo run --locked --release --bin gt-corpus -- oracle-check --report docs/gt/ORACLE_M4.json
      - name: The committed corridor report reproduces (Tier A, every metric)
        run: cargo run --locked --release --bin gt-corpus -- corridor-check --report docs/gt/CORRIDOR_M4.json
      - name: The committed topology report reproduces (Tier A, every metric)
        run: cargo run --locked --release --bin gt-corpus -- topology-check --report docs/gt/TOPOLOGY_M4_5.json
      - name: The committed DCEL report reproduces (Tier A, every metric)
        run: cargo run --locked --release --bin gt-corpus -- dcel-check --report docs/gt/DCEL_M5.json
      - name: The committed M6 geometry report reproduces (Tier A, every boundary and arm)
        run: cargo run --locked --release --bin gt-corpus -- geometry-m6-check --gates configs/GATES_V1.toml --report docs/gt/GEOMETRY_M6.json

# Reproducing the pinned donor baselines needs local mirrors and a 104 MiB
# hash-pinned asset, which CI has neither of; that step is executed by the
# reviewer on a machine that has them (spec §34, docs/REPRODUCIBILITY_M3.md).
