<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>vice-classic</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>vice-classic</h1>
    <p>Selective classical vectorization. Unsupported and ambiguous inputs stay explicit.</p>
    <label>Image <input id="input" type="file" accept="image/png,image/jpeg,image/webp"></label>
    <label>Preset
      <select id="preset"><option value="fast">Fast</option><option value="quality">Quality</option></select>
    </label>
    <button id="run" type="button">Vectorize</button>
    <p id="status" role="status" aria-live="polite">Choose an image.</p>
    <section id="result" hidden>
      <img id="preview" alt="Vectorized result preview">
      <a id="download" download="result.svg">Download SVG</a>
    </section>
    <details><summary>Diagnostic report</summary><pre id="report"></pre></details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
