# Frozen gates and code-table placeholders (spec v1.3 §27.7, §28 M3).
#
# RULE (§27.7, §32 rule 9): "Gate/config/noise/code tables меняются
# отдельным reviewed commit. Feature PR не может одновременно ослабить
# собственный gate."
#
# That rule is enforced, not requested. `gt-corpus gates-check` fails when a
# commit MODIFIES this file and also touches anything under `crates/` or
# `tests/fixtures/`, and CI runs it over every commit of every pushed range
# (REVIEW_M3 M3-N2 corrected both the command name here and a CI check that
# only ever looked at the tip of a push).
#
# One named exemption, because the rule forbids WEAKENING a gate and a gate
# that does not exist cannot be weakened: this file may be CREATED in the
# same commit as its loader. Only status `A` exempts; modification,
# deletion and rename do not.
#
# Every value below is read or cross-checked by the code — enforced by
# `gates::tests::every_frozen_value_agrees_with_the_code_that_uses_it`,
# which walks every frozen section and fails on a key nothing consumes. A
# frozen number with no consumer is not a gate (REVIEW_M3 M3-N3).
#
# The values below are the M3 measurement contract. Numbers that no
# measurement supports yet are marked `status = "placeholder"` and carry the
# milestone that will set them; a placeholder is NOT a threshold and the
# scorecard refuses to gate on one.

schema = "vice-classic/gates/v1"
version = "v1"

# --- Statistical court (§27.4, frozen before any audit) ---------------------
[reliability]
status = "frozen"
confidence = 0.99
catastrophic_risk_target = 0.01
# Derived, not typed in: see reliability::required_groups_for_zero_failures.
min_accepted_source_groups_zero_failures = 459
unit_of_trial = "source_group"

# --- Corpus instruments (§27.1; measured in C066) ---------------------------
[corpus_instruments]
status = "frozen"
# Measured accuracy of the supersampling integrator against the exact
# per-pixel clip integrator, on box coverage. Sensitivity and specificity of
# these numbers are the measurement in gt::raster::tests.
supersample_max_abs = 0.06
supersample_edge_mean_abs = 0.02
# The inverse-crime arm must keep agreeing with the exact integrator to f64
# noise; if it ever does not, one of the two is broken.
vice_render_max_abs = 1e-9
# The external engines are the INDEPENDENCE arm, not the accuracy arm
# (ADR-0012 §2). These bound their 8-bit AA noise on the committed corpus.
tiny_skia_max_abs = 0.35
raqote_max_abs = 0.35

# --- Identifiability (§1.5; calibrated in C067) -----------------------------
[identifiability]
status = "frozen"
# Smallest salient LENGTH in render px whose parameters stay recoverable.
# Calibrated against a rival member 1.4x larger; both directions asserted.
observability_floor_px = 0.35
rival_indistinguishable_codes = 4
quantization_floor_codes = 1.0

# --- Split and audit (§27.1) ------------------------------------------------
[split]
status = "frozen"
policy_version = "vice-classic/gt-split/v1"
development_pct = 55
calibration_pct = 20
sealed_audit_pct = 25
unit_of_assignment = "shape_family"
held_out_profiles = ["tiny-skia"]

# --- Likelihood (§17.1) -----------------------------------------------------
[likelihood]
status = "frozen"
# `iid_pixel` is diagnostic ONLY and may never drive production confidence
# (§17.1). The gate that enforces this is
# correlation::guard_confidence_claim.
allowed_production_residual_models = ["whitening", "block", "orthogonal_band"]
diagnostic_only_residual_models = ["iid_pixel"]

# --- Code tables and quality gates that M3 cannot set yet -------------------
# These exist so the shape of the contract is fixed and so that a later
# milestone has to CHANGE a declared placeholder rather than invent a
# threshold. A placeholder is not a threshold: the scorecard refuses to
# gate on any entry whose status is "placeholder".
[boundary_accuracy]
status = "placeholder"
set_by_milestone = "M7"
p95_px = 0.35
p99_px = 0.60
max_px = 1.50

[geometry_code_table]
status = "placeholder"
set_by_milestone = "M6"
bits_per_anchor = 0.0
bits_per_segment_family = 0.0
bits_per_relation = 0.0

# --- Observation noise (§17.1; measured in M4) -------------------------------
# MEASURED, not chosen, on the development split by
# `vice-bench::corridor::tests::the_clean_bucket_noise_scale_is_measured_on_the_development_split`:
# the RMS disagreement about COVERAGE between the analytic family the M4
# formation hypotheses predict and the antialiasing an independent engine
# actually performed, over edge pixels. 9.54 codes against tiny-skia, 24.84
# against raqote, 18.81 pooled; pooled is what is frozen, because at
# inference time nothing says which engine drew the image.
#
# It is in the COVERAGE domain, so unlike quantization it is NOT divided by
# the mixture conditioning. Getting that wrong is what made the first
# corridor two to three times too narrow (FAILURE_LEDGER F-0023).
#
# Consumer: `vice_evidence::corridor::CLEAN_BUCKET_SIGMA_CODES`, cross-checked
# by `gates::tests::every_frozen_value_agrees_with_the_code_that_uses_it`.
[noise_scales]
status = "frozen"
set_by_milestone = "M4"
clean_bucket_sigma_codes = 18.8

# The degraded bucket of §17.1 is a robust mixture with a codec/outlier
# component, and no measurement supports it yet: JPEG/WebP arrive with M9
# (§27.2, §28 M9). Declared as a placeholder with its owner rather than
# invented, which is the same rule the M3 tables followed.
[noise_scales_degraded]
status = "placeholder"
set_by_milestone = "M9"
degraded_bucket_sigma_codes = 0.0
