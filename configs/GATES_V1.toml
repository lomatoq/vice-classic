gate_min_geometry_arms_per_boundary = 5
gate_min_oracle_candidate_injections = 10
gate_min_oracle_selector_changes = 1
gate_min_injection_selector_changes = 1
gate_min_forced_selector_changes = 1
gate_min_raster_derived_rows = 6
