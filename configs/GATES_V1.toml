# Frozen gates and code-table placeholders (spec v1.3 §27.7, §28 M3).
#
# RULE (§27.7, §32 rule 9): "Gate/config/noise/code tables меняются
# отдельным reviewed commit. Feature PR не может одновременно ослабить
# собственный gate."
#
# That rule is enforced, not requested. `gt-corpus gates-check` fails when a
# commit MODIFIES this file and also touches anything under `crates/` or
# `tests/fixtures/`, and CI runs it over every commit of every pushed range
# (REVIEW_M3 M3-N2 corrected both the command name here and a CI check that
# only ever looked at the tip of a push).
#
# One named exemption, because the rule forbids WEAKENING a gate and a gate
# that does not exist cannot be weakened: this file may be CREATED in the
# same commit as its loader. Only status `A` exempts; modification,
# deletion and rename do not.
#
# Every value below is read or cross-checked by the code — enforced by
# `gates::tests::every_frozen_value_agrees_with_the_code_that_uses_it`,
# which walks every frozen section and fails on a key nothing consumes. A
# frozen number with no consumer is not a gate (REVIEW_M3 M3-N3).
#
# The values below are the M3 measurement contract. Numbers that no
# measurement supports yet are marked `status = "placeholder"` and carry the
# milestone that will set them; a placeholder is NOT a threshold and the
# scorecard refuses to gate on one.

schema = "vice-classic/gates/v1"
version = "v1"

# --- Statistical court (§27.4, frozen before any audit) ---------------------
[reliability]
status = "frozen"
confidence = 0.99
catastrophic_risk_target = 0.01
# Derived, not typed in: see reliability::required_groups_for_zero_failures.
min_accepted_source_groups_zero_failures = 459
unit_of_trial = "source_group"

# --- Corpus instruments (§27.1; measured in C066) ---------------------------
[corpus_instruments]
status = "frozen"
# Measured accuracy of the supersampling integrator against the exact
# per-pixel clip integrator, on box coverage. Sensitivity and specificity of
# these numbers are the measurement in gt::raster::tests.
supersample_max_abs = 0.06
supersample_edge_mean_abs = 0.02
# The inverse-crime arm must keep agreeing with the exact integrator to f64
# noise; if it ever does not, one of the two is broken.
vice_render_max_abs = 1e-9
# The external engines are the INDEPENDENCE arm, not the accuracy arm
# (ADR-0012 §2). These bound their 8-bit AA noise on the committed corpus.
tiny_skia_max_abs = 0.35
raqote_max_abs = 0.35

# --- Identifiability (§1.5; calibrated in C067) -----------------------------
[identifiability]
status = "frozen"
# Smallest salient LENGTH in render px whose parameters stay recoverable.
# Calibrated against a rival member 1.4x larger; both directions asserted.
observability_floor_px = 0.35
rival_indistinguishable_codes = 4
quantization_floor_codes = 1.0

# --- Split and audit (§27.1) ------------------------------------------------
[split]
status = "frozen"
policy_version = "vice-classic/gt-split/v1"
development_pct = 55
calibration_pct = 20
sealed_audit_pct = 25
unit_of_assignment = "shape_family"
held_out_profiles = ["tiny-skia"]

# --- Likelihood (§17.1) -----------------------------------------------------
[likelihood]
status = "frozen"
# `iid_pixel` is diagnostic ONLY and may never drive production confidence
# (§17.1). The gate that enforces this is
# correlation::guard_confidence_claim.
allowed_production_residual_models = ["whitening", "block", "orthogonal_band"]
diagnostic_only_residual_models = ["iid_pixel"]

# --- Code tables and quality gates that M3 cannot set yet -------------------
# These exist so the shape of the contract is fixed and so that a later
# milestone has to CHANGE a declared placeholder rather than invent a
# threshold. A placeholder is not a threshold: the scorecard refuses to
# gate on any entry whose status is "placeholder".
[boundary_accuracy]
status = "placeholder"
set_by_milestone = "M7"
p95_px = 0.35
p99_px = 0.60
max_px = 1.50

# --- M7 selective delivery and resource court (§1.5, §27.4, §29) -----------
#
# Declaration commit only. The M7 measurement/analysis consumer lands in a
# later crates-only commit; measured values are frozen in a final gate-only
# commit. Until then this section is a placeholder and cannot authorize a
# production success or a promotion verdict.
[m7_selective]
status = "placeholder"
set_by_milestone = "M7"
posterior_lower_bound_threshold = 0.0
empirical_unexplored_relative_mass_upper_bound = 0.0
gate_min_source_coverage_128_512 = 0.80
gate_max_palette_code_delta = 4
gate_max_quality_p95_ms = 10000
gate_max_fast_p95_ms = 1000
gate_max_peak_memory_bytes = 1073741824

# --- Geometry code table (§14.5; DERIVED in M6) ------------------------------
# §14.5's minimal explicit code: a prefix code over families and a parameter
# code `log2(range / calibrated precision)`. Every value below is DERIVED from
# something this file or the model universe already froze, and the derivation is
# checked by
# `universe::tests::the_geometry_code_table_agrees_with_the_universe_it_codes_over`,
# which lives in `vice-bench` because that is the only crate that can see the
# universe and `[identifiability]` at once.
#
#   bits_per_anchor         = 2 * log2(canvas_dim_px.hi / observability_floor_px)
#                           = 2 * log2(16384 / 0.35)
#   bits_per_segment_family = log2(5 admissible segment families)
#   bits_per_relation       = log2(6 relation families)
#
# The range for an anchor is the universe's MAXIMUM canvas; the code
# `vice_fit::code::GeometryCodeTable::anchor_bits` applies the image's own canvas
# by exact arithmetic on the number below, so the number below is what governs
# behaviour rather than a rounded copy of something recomputed elsewhere.
#
# The calibrated precision is NOT repeated as a fourth key. It is recovered by
# inverting `bits_per_anchor`, so a guard cannot share a key with its mechanism
# (FAILURE_LEDGER F-0048 Q4) and there is exactly one length constant.
#
# Consumers: `vice_fit::code::GEOMETRY_CODE_TABLE_V1`, which prices every edge
# and node of the §14.3 grammar DAG, every §15 relation hypothesis and every
# whole-loop primitive sibling.
#
# WAS: `status = "placeholder"`, `set_by_milestone = "M6"`, all three values
# `0.0`. A table of zeros prices an unbounded grammar at nothing;
# `GeometryCodeTable::new` now refuses to mint one.
[geometry_code_table]
status = "frozen"
bits_per_anchor = 31.029146
bits_per_segment_family = 2.321928
bits_per_relation = 2.584963

# --- Geometry pricing surface (RT6-A3; frozen at M6 delta-1) -----------------
# [geometry_code_table] froze three numbers, and the red team repriced the
# grammar AROUND them in one line: `flag_bits` of the arc 2.0 -> 0.0 flipped
# arc-vs-line decisions and moved published corpus numbers (including the G1
# clause's own population, 8 -> 9) with the gate file untouched and every test
# green. A number that decides whether a §28 clause is green is a gate,
# wherever it is written (RT45-A5, M45-N6).
#
# So the WHOLE surface is frozen by content: `vice_fit::pricing_surface_v1`
# enumerates every price the grammar consults - span and whole-loop family
# flags/free parameters, relation flags, determined scalars and saving
# ownership, the full free_scalars domain, the join-kind count and path-order
# policy, the Huber loss at probes bracketing its knee, independent-observation
# counts including overflow refusal, the gap code, the coordinate-bits factor,
# jet-compatibility pruning and smooth-join reachability - by CALLING the real
# functions, and this key is
# the SHA-256 of that enumeration. Any repricing anywhere on the surface moves
# the hash and fails `every_frozen_value_agrees_with_the_code_that_uses_it`,
# making the §27.7 commit unavoidable rather than polite.
#
# Stated residual: the continuous pieces are pinned at probe points, so a
# reshaped loss that agrees at the probes passes; the probes bracket the knee,
# which is the loss's one structural feature.
[geometry_pricing]
status = "frozen"
pricing_surface_sha256 = "1060cc132bde90a32043a9a7bca6c6936be241b38ac20523ed2f76bea0dfc691"

# --- Observation noise (§17.1; measured in M4) -------------------------------
# MEASURED, not chosen, on the development split by
# `vice-bench::corridor::tests::the_clean_bucket_noise_scale_is_measured_on_the_development_split`:
# the RMS disagreement about COVERAGE between the analytic family the M4
# formation hypotheses predict and the antialiasing an independent engine
# actually performed, over edge pixels. 9.54 codes against tiny-skia, 24.84
# against raqote, 18.81 pooled; pooled is what is frozen, because at
# inference time nothing says which engine drew the image.
#
# It is in the COVERAGE domain, so unlike quantization it is NOT divided by
# the mixture conditioning. Getting that wrong is what made the first
# corridor two to three times too narrow (FAILURE_LEDGER F-0023).
#
# Consumer: `vice_evidence::corridor::CLEAN_BUCKET_SIGMA_CODES`, cross-checked
# by `gates::tests::every_frozen_value_agrees_with_the_code_that_uses_it`.
# RE-FROZEN by the M4 delta after the procedure was corrected (REVIEW_M4
# blocker 2 / M4-N2, FAILURE_LEDGER F-0027).
#
# WAS: 18.8, pooled over `tiny-skia` (9.54) and `raqote` (24.84). That pool
# contained the HELD-OUT engine, which `[split] held_out_profiles` above keeps
# out of development, and the §28 M4 clause this number sets the width of is
# precisely the one about generalizing to an engine the calibration never saw.
#
# IS: 25.57 codes, from `raqote` alone over 11481 edge pixels, measured on
# `corridor::frozen_calibration_groups()` — development groups, and only the
# profiles the split policy allows there. It is the coarsest engine the
# calibration may see, which is the right choice because inference is not told
# which engine drew the image.
#
# The correction WIDENED the corridor (median halfwidth 0.233 -> 0.311 px) and
# raised held-out coverage@95 from 0.976 to 0.996, so the old number was the
# stricter one: the published coverage was never bought with width.
[noise_scales]
status = "frozen"
set_by_milestone = "M4"
clean_bucket_sigma_codes = 25.57

# The degraded bucket of §17.1 is a robust mixture with a codec/outlier
# component, and no measurement supports it yet: JPEG/WebP arrive with M9
# (§27.2, §28 M9). Declared as a placeholder with its owner rather than
# invented, which is the same rule the M3 tables followed.
[noise_scales_degraded]
status = "placeholder"
set_by_milestone = "M9"
degraded_bucket_sigma_codes = 0.0

# --- Topology envelope and its gate thresholds (§11, §28 M4.5) --------------
# REVIEW_M4_5 condition 7 / M45-N6 / RT45-A5. STATUS_M4_5 §3 said
# "configs/GATES_V1.toml is untouched: M4.5 freezes no new constant, so §27.7
# has nothing to enforce here". That was false as a measurement, and it is the
# kind of false that matters: the numbers deciding whether a §28 M4.5 clause is
# green live in `report.rs::gate_table` and in the four `*_CONFIG_V1` constants
# of `vice-topology`, i.e. in the same files a feature commit edits. §27.7's
# second sentence — "a feature PR may not weaken its own gate" — therefore had
# nothing to act on, and a single commit could relax a population threshold and
# change the code that meets it.
#
# Registered here so that `gates-check` can do its job. Consumers are declared
# in `gates::tests::every_frozen_value_agrees_with_the_code_that_uses_it`,
# which fails on a key nothing reads, and
# `topology_gate_thresholds_are_registered_here` fails on a threshold in a gate
# row that has no key.
#
# Landed as a placeholder first because §27.7 forbids changing this file and
# production code in one commit: the section arrives with no code, the claims
# and the check arrive next, the freeze arrives after. That is the same three
# step shape M4 used for the clean-bucket noise scale (C134/C135/C136).
[topology]
status = "frozen"
set_by_milestone = "M4.5"

# Restoration operators of §11.1. Fixed counts and fixed steps: no convergence
# test, no adaptive step, because the artifact is Tier A and a stopping rule
# that depends on the data is a stopping rule that depends on the platform.
field_tv_iterations = 30
field_tv_step = 0.15
field_tv_huber_delta = 0.05
field_tv_data_weight = 1.0
field_deconv_iterations = 10
field_deconv_step = 0.7

# Which levels the generator produces at all (§11.2, §23).
level_max_plateau_levels = 6
level_max_event_levels = 8
level_min_event_persistence = 0.02
level_fixed_smoke_count = 1
level_fixed_smoke_first = 0.5

# Tier 3 pruning (§11.3). NOT calibrated - measured as harmless on this corpus
# (no topological class lost, budget active on 11 arms of 132) and recorded as
# a limitation rather than as a calibration.
envelope_budget = 48
envelope_per_quota_class = 2
envelope_mass_scale = 8.0

# §11.4 continuation.
continuation_halo_px = 3
continuation_max_plans = 8

# Population thresholds of the gate rows themselves. These are the ones
# RT45-A5 weakened together with the code in a single commit that `gates-check`
# waved through: with `min_recall_arms` at 1 and the envelope budget at 6, one
# commit both relaxed the clause and changed what had to meet it.
gate_min_recall_arms = 20
gate_min_recall_shape_families = 5
gate_min_non_trivial_gt_arms = 5
gate_min_topology_pairs = 2
gate_min_classes_per_retaining_pair = 2

# --- Numbers that decide whether a gate CONTROL is alive (§27.7) -------------
# REVIEW_M4_5 condition 4 (reopened by addendum 2) / REDTEAM RT45-A12.
#
# The section above registers the population THRESHOLDS of the gate rows. It
# did not register the numbers that decide whether a row's CONTROL measures
# anything, and that turned out to be the same kind of number. The knockout
# disk radius was the literal `0.3` inside `measure_arm`: `0.3 -> 0.0001`
# empties the unrelated field, the knockout falls to 0 of 100, the conjunct
# `knockout < real` is satisfied TRIVIALLY, and the clause stays MET with its
# only control switched off. One commit, no gate file touched, exit 0.
#
# The GT majority level is here for a stronger reason than the radius. It does
# not tune a control - it defines the TRUTH the whole clause is scored against.
# Moving it re-labels every fixture at once, and §27.7's second sentence exists
# precisely so that a feature commit cannot move it beside the code it judges.
#
# Placeholder in this commit: §27.7 forbids changing the gate file and
# production code together, so the keys land first, their claims in
# `gates/mod.rs` land next, and the freeze is the commit after that - the same
# three-step C178/C179/C180 used for [topology].
[topology_controls]
status = "frozen"
set_by_milestone = "M4.5"

# Radius of the knockout disk, as a fraction of min(width, height).
gate_knockout_disk_radius_fraction = 0.3
# Coverage level at which exact ink becomes inside/outside for the ground truth.
gate_gt_majority_level = 0.5

# --- Shared DCEL and topological transactions (§12, §11.4, §28 M5) ----------
# The population thresholds of the four §28 M5 gate rows.
#
# Registered here for the reason REVIEW_M4_5 condition 7 / M45-N6 / RT45-A5
# established for the M4.5 rows: a number that decides whether a §28 clause is
# green is a gate, wherever it is written. If these lived beside the rows in
# `dcel/report.rs`, one commit could relax a population threshold and change the
# code that meets it, and §27.7's second sentence would have nothing to act on.
#
# The rows read them through `Threshold::from_gates`, which is the ONLY mint of
# a `Threshold` and takes a gate FILE, a section and a key — never a number. M5
# needed a second gate config and the obvious way to give it one was a
# `Threshold::from_gate_file(u64)`; that would have been a mint accepting any
# integer, which is the door RT45-A10 came through the first time. A constructor
# taking `u64` does not stop arithmetic, it moves it one line earlier.
#
# Landed as a placeholder first, with no code in that commit: §27.7 forbids
# changing this file and production code together, so the keys arrived here
# (C239), the rows that read them arrived next (C240), and this is the freeze.
# Same three-step shape M4 used for the clean-bucket noise scale
# (C134/C135/C136) and M4.5 for [topology] (C178/C179/C180).
#
# MEASURED, not chosen. Every number below is a floor read off the full-scope
# run - `dcel_harness::the_full_scope_population_is_what_the_thresholds_were_read_from`
# prints it and a reviewer repeats it.
#
# WAS, and it was STALE BY TWO DELTAS at the moment M5 closed:
#
#   arms 474 (444 corpus, 30 structural), groups 237, convention-dependent 10,
#   transactions 159 of 167 committed, unrelated chains 127, probes 28
#
# Six of those eight numbers were false against `docs/gt/DCEL_M5.json` at
# `c4fc903`. The population moved at C261 (delta-3), when the structural
# register grew; this file was last edited at C269 (delta-5) and its provenance
# comment was not brought along. Only "444 corpus" survived.
#
# This is the THIRD occurrence of the class in this one comment block. RT5-A4
# and REVIEW_M5_A N8b found it when the text said 159 and the artifact said
# 167; the WAS/IS note below records that correction; and at the very next
# delta the same number drifted again, 167 -> 170, with nothing to catch it.
# Nothing catches it because it is a COMMENT: the test named above PRINTS the
# population and asserts none of it, and `every_frozen_value_agrees_with_the_
# code_that_uses_it` compares KEYS, not prose. That is limitation 36's class
# exactly, in the file §27.7 exists to keep reviewable, and limitation 36's
# owner is M6.
#
# IS, measured at M6 delta-1 against DCEL_M5.json at HEAD (C317, the C283
# class of correction, FIFTH occurrence of this block's own drift class):
#
#   arms 480 (444 corpus, 36 structural), groups 240, convention-dependent 13,
#   transaction shapes 3, transactions 750 of 1032 committed, of which 178
#   COMPOUND and all 178 committed, max declared steps 4,
#   unrelated chains 610, probes 30, slots perturbed 179 253,
#   classes [(0,0), (1,0), (1,1), (2,0), (2,1), (3,0), (3,1), (5,0)]
#
# WAS (the C283 text, correct when written, stale from C287): "transaction
# shapes 2, transactions 678 of 960 committed, of which 172 COMPOUND and all
# 172 committed, unrelated chains 556". The third edit shape (C287, hole fill)
# moved four of those quantities and three later gate-file edits (C289, C291,
# C308) did not bring the comment along - the exact C261/C269 pattern this
# block itself narrates, in the milestone that recorded its third occurrence
# and predicted the fourth. Reviewer B measured it (M6B-N1, ledger F-0093);
# limitation 56's mechanism - binding this prose to the run - remains unbuilt
# and its price unchanged, now with five occurrences behind it. The FLOORS were
# never wrong: every value moved AWAY from its floor, the safe direction.
#
# NO FLOOR IS CHANGED BY THIS COMMIT, and none is added. Every floor below
# still sits under the measurement, and each is now further under it than it
# was, which is the safe direction. The floor this population NEEDS and does
# not have is `gate_min_compound_transactions`: without it a future harness
# could lose the annulus shape and `transactions_compound` would fall to zero
# with every row still MET. Adding it is a three-commit sequence under §27.7
# (key as placeholder, then the consumer, then the freeze) because a frozen
# number with no consumer is not a gate; it is recorded in `docs/STATUS_M6.md`
# as an open item with that price rather than half-added here.
#
# The floors are set BELOW the measurement on purpose. A threshold equal to
# today's count is a threshold that fails the first time the corpus changes for
# an unrelated reason, and one set at the measurement is not a floor but a
# fingerprint. What each floor asserts is that the population is big enough for
# the clause to be about something - which is the question F-0039 makes these
# rows answer.
[dcel]
status = "frozen"
set_by_milestone = "M5"

# Arms the run must measure at all. Measured 474.
gate_min_arms = 200
# Arms from the STRUCTURAL register.
#
# WAS: "Clause 1 has no population without them: STATUS_M4_5 limitation 18
# records that zero of the corpus's arms carry a convention-dependent class."
# The premise is FALSE on M5's population and the evidence row says so: of the
# 10 convention-dependent groups, 7 are CORPUS groups and 3 come from the
# register. Limitation 18 was measured on M4.5's 132 arms over different cells,
# and carrying a limitation across a milestone obliges recomputing its number on
# the new population (REVIEW_M5_B N13c).
#
# IS: the register guarantees the population BY CONSTRUCTION, at every size and
# under both convention arms; the corpus supplies it IN FACT on this cell set
# and need not on another. That is why the floor is on the register's arms and
# not on the corpus's. Measured 30.
gate_min_structural_arms = 20
# Groups whose two complementary-connectivity arms DISAGREE about the class.
# This is the population on which "the stage did not reduce a set of topologies"
# says anything at all. Measured 10.
gate_min_convention_dependent_groups = 5
# Transactions that committed. A clause about transactions is satisfiable by
# running none.
#
# WAS: "Measured 159 of 167 attempted." That was a PRE-C243 measurement, frozen
# into this file by C241 whose message says the floors were read "from a run".
# C243 turned the eight `adv/sliver` arms - thinner than a pixel, digitized to
# nothing - from audit failures into valid empty arrangements, and their eight
# transactions from rollbacks into commits. The artifact has said 167 of 167
# ever since and this comment said 159 (REVIEW_M5_A N8b, REDTEAM_M5 RT5-A4).
#
# It matters more here than in a status document: this file's comments are its
# provenance record, and §27.7 exists to make exactly this file's history
# reviewable. IS: 167 attempted, 167 committed, of which 159 on arms whose
# arrangement is non-empty - and 159 is what clause 3 now counts, because a
# clause may not stand on an arm that contains nothing.
gate_min_transactions = 50
# Boundary chains lying wholly outside a committed transaction's region. Zero
# moved means nothing when zero were there. Measured 127.
gate_min_unrelated_chain_population = 40
# Arrangements the mutation walk probed. The walk is what exhibits the world in
# which the audit is red; a walk that visited nothing would make clause 4 a
# report of silence. Measured 28.
gate_min_resolving_power_probes = 10
# Arms of the STRUCTURAL REGISTER carrying a face loop of three or more
# half-edges: the population §12's ORIENTED clause stands on, because a loop of
# one or two has no reordering that changes it.
#
# REDTEAM_M5 RT5-A17 and REVIEW_M5_A D3-N1, found independently. Delta-3 gave
# that clause a FIXTURE and no floor, and it was the fourth population of this
# gate to need one — clause 1's convention-dependent groups, clause 3's
# unrelated chains and clause 4's slots and probes all got floors, and this did
# not. A fixture makes a check exercised TODAY; a floor makes it exercised
# TOMORROW, when somebody edits the register.
#
# On the REGISTER rather than on the total, because that is where the guarantee
# is BY CONSTRUCTION (condition 51's standard: every size, both arms). The
# corpus carries 14 such arms and they are published beside this, but they are
# incidental and a corpus change could remove them. Measured: 6 register arms,
# 20 in total, longest loop 8 half-edges.
#
# SIX, not four (REVIEW_M5_A D4-N3). The register produces exactly six —
# `diagonal_staircase` at three sizes under two convention arms — and a floor of
# four left room for a WHOLE SIZE to drop out while the row stayed MET, in a key
# whose own comment justifies its placement by condition 51's standard of "every
# size, both arms". A floor that permits the standard it cites to be broken is
# not encoding that standard. At six it is exact: lose any size, or any arm, and
# the row goes NOT MET.
#
# The cost of exactness is named rather than hidden: this floor now moves
# whenever the register's size list does, which is a gate-file commit under
# §27.7. That is the correct price for a number that means "every size".
gate_min_register_arms_with_a_long_loop = 6
# Slots the mutation walk must perturb. `slots_perturbed > 0` stood as a
# conjunct in the clause-4 row and was not a gate: a walk that visited ONE slot
# satisfied it. REDTEAM_M5 RT5-A2 is why this key exists - two of the three
# numbers that row published were arithmetic, so the only thing it really asked
# of the audit was one caught slot. Measured 155 160.
gate_min_slots_perturbed = 40000

# --- Compound topological transactions (§28 M5, §11.4; delivered in M6) ------
# §28 M5's bullet "local COMPOUND topology transactions" was carried into M6
# with no second deferral available. It is delivered, and this section is the
# floor that keeps it delivered.
#
# WHY IT IS NEEDED, in one sentence a reviewer can check: the compound
# population exists only because the harness applies more than one edit SHAPE,
# and a commit that lost the annulus shape would drop `transactions_compound`
# to zero with all four §28 M5 rows still MET. That is REVIEW_M5_A M5A-D3-N1
# exactly — "when a check is added because its population was empty, the
# population is part of the check" — and it is the fifth population of this
# gate to need a floor, after clause 1's convention-dependent groups, clause
# 3's unrelated chains, and clause 4's slots and probes.
#
# It is also F-0081's guard. The 310 arms M5 reported as excluded-as-compound
# were not compound at all; they declare the identity delta. A floor on
# `transactions_compound` is the number that would have made that visible on
# the first run rather than on the milestone after.
#
# PLACEHOLDER in this commit, and that is the §27.7 three-step this repository
# already uses (C178/C179/C180 for [topology], C239/C240/C241 for [dcel]): the
# keys land here with no code, the consumer lands next, the freeze lands after.
# A placeholder is not a threshold and no row may gate on one.
# FROZEN. Measured at C288 on the full scope: 178 compound transactions, all
# 178 committed, FIVE distinct compound deltas, 3 edit shapes.
#
# WAS: "4 distinct compound deltas" here and "Measured: four distinct" on the
# key below. Reviewer A measured the artifact AS COMMITTED AT C288 and it
# carried FIVE distinct compound deltas even then: the third edit shape had
# added compound(c-1,h-1) three commits before the freeze, and the freeze
# comment quoted the TWO-shape population's count beside the three-shape
# population's 178 - a numerator and a denominator from different populations,
# F-0082's class, in the commit that froze this section (M6A-N2, ledger
# F-0093). The floor of 3 itself was and is sound: it sits below both the
# false 4 and the true 5. The five, from DCEL_M5.json: (+1,+1) 118,
# (-1,+1) 46, (+0,+2) 6, (-1,-1) 6, (-3,+1) 2, sum 178.
#
# The first two floors sit BELOW the measurement, on this file's own rule that
# a threshold equal to today's count is a fingerprint rather than a floor. The
# SHAPE floor is the exception and is set AT the measurement, 3 of 3, because
# losing a shape is precisely the regression it exists to catch and a floor of
# two would permit it. The cost is named rather than hidden: this floor now
# moves whenever the shape set does, which is a gate-file commit under §27.7.
# That is the correct price for a number meaning "all three shapes".
[dcel_compound]
status = "frozen"
set_by_milestone = "M6"

# Transactions whose declared edit is worth two or more unit steps.
gate_min_compound_transactions = 100
# Distinct compound DELTAS the run must exercise. A floor on the count alone is
# satisfied by one delta repeated: 118 copies of (+1,+1) would meet a floor of
# 100 and would test one shape's one behaviour. Measured: FIVE distinct (the
# word here said "four" from freeze until the C316 correction - see the WAS
# block above).
gate_min_distinct_compound_deltas = 3
# Edit shapes the harness applies per arm. The count above is a CONSEQUENCE of
# this one, and losing a shape is the cheapest way to empty the population, so
# it gets its own floor rather than being inferred from the consequence.
gate_min_transaction_shapes = 3

# --- M6 geometry selection and oracle decomposition (§14–§15, §28 M6) -------
#
# FROZEN after the consumers landed in C327. Independent reviewers A/B found that every
# number deciding the three already-green M6 clauses lived beside the test it
# judged, so one feature commit could relax the test and change the mechanism
# together (M6A-C5 / M6B-N8). The same is true of the population floors the
# G00–G20 decomposition now needs.
#
# This was the repository's §27.7 three-step:
#   1. these key names land while the section is a placeholder;
#   2. the M6 scorecard and every consumer land in a later code commit;
#   3. measured values and `status = "frozen"` land in a gate-file-only commit.
#
# Full raster-derived run used for these floors: one scene from each independent
# development source group plus three certified M6 raster witnesses, 25 scenes
# total. Production Stage F exposed 18 eligible closed chains; the exact
# common population on which all five arms completed is 6 rows. Those rows
# contain 11 forced-GT candidate injections, 2 G01 geometry changes, 4 G10
# geometry changes, 1 G11 geometry change, 3 selected relation rows, and 2
# selected whole-loop primitive rows. The selector changes compare hashes of
# materialized geometry, not source labels or code lengths.
[m6_geometry]
status = "frozen"
set_by_milestone = "M6"

gate_max_g1_spread_rad = 1e-9
gate_min_g1_nodes = 1
